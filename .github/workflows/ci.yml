name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: transit_test
          POSTGRES_USER: transit
          POSTGRES_PASSWORD: transit123
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U transit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Start integration dependencies
        run: |
          docker compose up -d redis neo4j zookeeper kafka

      - name: Wait for Redis
        run: |
          timeout 120 bash -c \
            'until docker compose exec -T redis redis-cli ping | grep -q PONG; do sleep 2; done'

      - name: Wait for Kafka
        run: |
          timeout 120 bash -c \
            'until docker compose exec -T kafka kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1; do sleep 2; done'

      - name: Wait for Neo4j
        run: |
          timeout 120 bash -c \
            'until docker compose exec -T neo4j cypher-shell -u neo4j -p password "RETURN 1" >/dev/null 2>&1; do sleep 2; done'

      - name: Build Backend
        run: cd backend && ./mvnw clean package -DskipTests

      - name: Run Tests
        run: cd backend && ./mvnw test

      - name: Show dependency logs on failure
        if: failure()
        run: docker compose logs redis neo4j zookeeper kafka

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & Build Frontend
        run: cd frontend && npm ci && npm run build