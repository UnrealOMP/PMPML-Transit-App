apiVersion: apps/v1
kind: Deployment
metadata:
  name: transit-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transit-backend
  template:
    metadata:
      labels:
        app: transit-backend
    spec:
      containers:
        - name: backend
          image: transit-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: transit-secrets
                  key: jwt-secret
          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 1Gi
              cpu: 1000m